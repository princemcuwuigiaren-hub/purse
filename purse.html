<!doctype html>
<!--
=====================================================================
PURSE  (working title)  v1.0.0
Offline-first personal finance PWA. Everything stays on the device.

PROJECT NOTE (for future sessions, not shown in the app)
---------------------------------------------------------
Files: index.html (this file), sw.js, manifest.webmanifest, icons/*
Status: v1.1.0. Verified in the dev environment (headless Chrome, 143 checks
in tests/e2e.py plus 76 in tests/e2e2.py); real-device testing pending.
Run tests: bash build.sh && python3 tests/e2e.py && python3 tests/e2e2.py
(needs Playwright + Chrome; run them one at a time, both use port 8765).

Known issues / open items
- Blank-note mystery (v1.0, seen once): probable cause found in v1.1. The
  sheet's 70 ms autofocus could steal focus from a field a fast bot had just
  tapped, so the typed text went nowhere. Fixed (focus is no longer pulled
  from a focused field); 24 stress runs clean afterwards. Not seen by hand.
- Passcode lock is a SCREEN LOCK, not encryption. Records stay readable in
  browser storage for anyone with the unlocked phone's browser tools, and
  backup/CSV files are not protected. Forgotten passcode: reset erases the
  records on the phone (restore from a backup file). Needs the client's OK.
- Lock needs a secure context (https or localhost) for WebCrypto.
- Limit warnings (80% / over) fire when adding a record, not when editing.
- Not tested: real phone, Firefox, Safari, on-screen keyboard behaviour,
  installed-app back gesture, recents-screen privacy cover, Play Store / TWA.
- Fixed in v1.1: truncated amount in limit sheet; info popover in the month
  sheet; delete left its sheet open; manifest id collided with other apps on
  the same github.io origin (id removed, Chrome now uses start_url).

Data/versions: data version 2 adds optional transaction "time" (HH:MM).
Lock config lives in its own key "purse.lock.v1" (salted PBKDF2-SHA256,
never in backups). Records saved before v1.1 have no time.

Architecture decisions
- Single-file app. Service worker, manifest and icons must be separate
  files (browser requirement), so the shipped set is small but not one file.
- Data: localStorage, key "purse.v1". Previous good copy: "purse.v1.prev".
  Amounts are integers in 1/100 of the currency unit for EVERY currency,
  so changing currency never corrupts values (it only changes the symbol).
- Financial month: user chooses a start day (1 to 31). Days beyond the
  length of a month clamp to its last day.
- Backup: a checksummed JSON file. Restore validates everything and keeps
  an undo snapshot ("purse.v1.restore-undo") for 7 days.
- Navigation: every overlay is a history entry, so the Android back
  gesture closes the top layer first. Tabs push one entry above Home.
- Android later: a Trusted Web Activity wrapper can use this PWA as is.
  Keep manifest/scope relative so hosting path can change.

Known limits (v1)
- Backup is manual (file). No cloud sync, no accounts.
- No recurring transactions, no multi-currency conversion.
- localStorage holds roughly 5 MB: tens of thousands of transactions.
=====================================================================
-->

<script>
/* Apply saved theme before first paint to avoid a flash. */
(function(){try{var t=localStorage.getItem('purse.theme');var dark=t==='dark'||(t!=='light'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
if(t===null&&!window.matchMedia('(prefers-color-scheme: light)').matches)dark=true;
document.documentElement.setAttribute('data-theme',dark?'dark':'light');
var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',dark?'#0A0C10':'#F5F1E8');}catch(e){}})();

<style>
/* =====================================================================
   DESIGN SYSTEM
   Direction: "ink and amber". Deep ink surfaces, one warm amber accent,
   serif numerals for money, quiet layered cards. Light theme is its own
   warm-paper palette, not an inversion.
   ===================================================================== */
:root{
  color-scheme:dark;
  --bg:#0A0C10; --bg-2:#0E1117; --surface:#141824; --surface-2:#1A2030; --surface-3:#232B40;
  --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.15);
  --text:#F4F1EA; --muted:#A3A9B7; --faint:#7B8294;
  --accent:#F0B45A; --accent-2:#E48B45; --accent-ink:#1B1204; --accent-text:#F0B45A;
  --pos:#5BD8A3; --neg:#FF8A76; --warn:#F5C451;
  --scrim:rgba(4,5,8,.64);
  --hero-a:#222B42; --hero-b:#131824; --hero-glow:rgba(240,180,90,.17);
  --shadow-card:0 1px 0 rgba(255,255,255,.04) inset, 0 20px 40px -24px rgba(0,0,0,.8);
  --shadow-pop:0 -24px 60px rgba(0,0,0,.55);
  --track:rgba(255,255,255,.09);
  --r-xs:10px; --r-sm:14px; --r:20px; --r-lg:28px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:ui-serif,Georgia,"Iowan Old Style","Noto Serif","Times New Roman",serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
:root[data-theme=light]{
  color-scheme:light;
  --bg:#F5F1E8; --bg-2:#EFEADE; --surface:#FFFFFF; --surface-2:#FAF6EC; --surface-3:#F0EADB;
  --line:rgba(40,32,12,.09); --line-strong:rgba(40,32,12,.2);
  --text:#17140D; --muted:#625E52; --faint:#8C877A;
  --accent:#E09A2B; --accent-2:#C97A1E; --accent-ink:#1E1403; --accent-text:#8A5206;
  --pos:#12805A; --neg:#B83F2A; --warn:#946A00;
  --scrim:rgba(30,22,6,.42);
  --hero-a:#FFF7E6; --hero-b:#FFFFFF; --hero-glow:rgba(224,154,43,.22);
  --shadow-card:0 1px 0 rgba(255,255,255,.9) inset, 0 18px 34px -22px rgba(80,56,10,.35);
  --shadow-pop:0 -24px 60px rgba(60,40,5,.25);
  --track:rgba(40,32,12,.09);
}
*{box-sizing:border-box;scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:400 16px/1.4 var(--font);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none}
.ico{display:block;flex:none}

/* ---------- shell ---------- */
#app{position:fixed;inset:0;max-width:560px;margin:0 auto;overflow:hidden;background:var(--bg)}
#view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(var(--sat) + 14px) 18px calc(112px + var(--sab));scroll-behavior:auto;-webkit-overflow-scrolling:touch}
#view:focus{outline:none}
.screen{animation:fadeUp .35s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- tab bar ---------- */
#tabbar{position:absolute;left:12px;right:12px;bottom:calc(10px + var(--sab));height:66px;border-radius:26px;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:center;
  background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3);
  border:1px solid var(--line-strong);box-shadow:0 18px 40px -16px rgba(0,0,0,.6);z-index:5}
.tab{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.02em;position:relative;border-radius:20px;min-width:44px}
.tab[aria-current=page]{color:var(--accent-text)}
.tab[aria-current=page]::after{content:"";position:absolute;bottom:6px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.fab{justify-self:center;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:var(--accent-ink);transform:translateY(-16px);
  background:linear-gradient(145deg,var(--accent),var(--accent-2));box-shadow:0 14px 28px -8px color-mix(in srgb,var(--accent) 60%,transparent),0 0 0 6px var(--bg);transition:transform .18s var(--ease)}
.fab:active{transform:translateY(-14px) scale(.94)}
.fab .ico{stroke-width:2.2}

/* ---------- type ---------- */
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.h-title{font-family:var(--font-display);font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.num{font-variant-numeric:tabular-nums}
.display{font-family:var(--font-display);font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)}

/* ---------- headers ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;min-height:44px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:23px;font-weight:600;letter-spacing:-.02em}
.brand i{width:26px;height:26px;border-radius:50%;display:block;background:conic-gradient(from 210deg,var(--accent),var(--accent-2) 55%,transparent 56%);-webkit-mask:radial-gradient(circle,transparent 8px,#000 9px);mask:radial-gradient(circle,transparent 8px,#000 9px)}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.icon-btn:active{background:var(--surface-2)}
.period{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px;margin-bottom:18px;width:max-content;max-width:100%}
.period button{height:40px;min-width:40px;display:grid;place-items:center;border-radius:999px;color:var(--muted)}
.period button:disabled{opacity:.35}
.period .label{padding:0 10px;font-weight:650;font-size:14.5px;min-width:0;white-space:nowrap}
.period .label small{display:block;font-size:10.5px;color:var(--accent-text);font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-card)}
.hero{position:relative;border-radius:var(--r-lg);padding:22px 20px 20px;overflow:hidden;border:1px solid var(--line-strong);
  background:radial-gradient(120% 90% at 100% 0%,var(--hero-glow),transparent 55%),linear-gradient(160deg,var(--hero-a),var(--hero-b));box-shadow:var(--shadow-card)}
.ring-wrap{position:relative;width:min(236px,68vw);aspect-ratio:1;margin:6px auto 4px}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-track{stroke:var(--track)} .ring-val{transition:stroke-dashoffset .9s var(--ease),stroke .3s}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 26px;gap:2px}
.ring-center .amt{font-size:34px;line-height:1.05}
.ring-center .amt.s{font-size:27px} .ring-center .amt.xs{font-size:22px}
.ring-center .sub{font-size:12.5px;color:var(--muted);max-width:150px}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:color-mix(in srgb,var(--bg) 40%,transparent);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.stat .k{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--font-display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 10px}
.link{color:var(--accent-text);font-weight:650;font-size:14px;min-height:40px;padding:0 4px;display:inline-flex;align-items:center;gap:2px}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:13px;padding:12px 4px;min-height:64px;width:100%;text-align:left;border-radius:var(--r-sm)}
.row + .row{border-top:1px solid var(--line);border-top-left-radius:0;border-top-right-radius:0}
.card .row{padding-left:14px;padding-right:14px}
.row:active{background:var(--surface-2)}
.tile{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,var(--accent)) 17%,transparent);color:color-mix(in srgb,var(--c,var(--accent)) 82%,var(--text))}
:root[data-theme=light] .tile{color:color-mix(in srgb,var(--c,var(--accent)) 68%,#000)}
.row .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .t{font-weight:600;font-size:15.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.row .s{font-size:12.8px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{text-align:right;font-weight:650;font-variant-numeric:tabular-nums;font-size:15.5px;white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.row2{display:grid;grid-template-columns:1.35fr 1fr;gap:10px}
.row2>.field{min-width:0}
.row .r small{font-size:12px;font-weight:500;color:var(--faint)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;padding:20px 4px 6px;font-size:12.5px;color:var(--faint);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.day-h span:last-child{letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- limits ---------- */
.lim{padding:14px 16px;display:flex;flex-direction:column;gap:11px;width:100%;text-align:left}
.lim-top{display:flex;align-items:center;gap:12px}
.lim-top .mid{flex:1;min-width:0}
.lim-top .t{font-weight:650;font-size:15.5px}
.lim-top .s{font-size:12.8px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:9px;border-radius:99px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .8s var(--ease)}
.bar.warn>i{background:linear-gradient(90deg,var(--warn),var(--accent-2))}
.bar.over>i{background:var(--neg)}
.pill{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--surface-3);color:var(--muted);white-space:nowrap}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.over{background:color-mix(in srgb,var(--neg) 20%,transparent);color:var(--neg)}
.pill.ok{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos)}
.stack{display:flex;flex-direction:column;gap:10px}

/* ---------- insights ---------- */
.stackbar{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;background:var(--track)}
.stackbar i{display:block;height:100%;min-width:3px}
.chart-card{padding:16px 14px 10px}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);padding:0 4px 8px}
.legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}

/* ---------- chips, segmented, buttons, fields ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-weight:600;font-size:14.5px;color:var(--muted)}
.chip .ico{width:18px;height:18px}
.chip[aria-pressed=true],.chip[aria-checked=true]{background:color-mix(in srgb,var(--accent) 18%,var(--surface));border-color:color-mix(in srgb,var(--accent) 60%,transparent);color:var(--text)}
.chip.cat[aria-checked=true] .ico{color:var(--c,var(--accent))}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px}
.seg button{min-height:42px;border-radius:99px;font-weight:650;font-size:14.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px}
.seg button[aria-pressed=true]{background:var(--surface-3);color:var(--text);box-shadow:0 1px 0 var(--line-strong) inset,0 6px 14px -8px rgba(0,0,0,.5)}
.seg button[data-kind=in][aria-pressed=true]{color:var(--pos)}
.seg button[data-kind=out][aria-pressed=true]{color:var(--neg)}
.btn{min-height:52px;border-radius:99px;padding:0 22px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:transform .15s var(--ease),filter .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(145deg,var(--accent),var(--accent-2));color:var(--accent-ink);box-shadow:0 12px 26px -12px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.soft{background:var(--surface-3);color:var(--text);border:1px solid var(--line)}
.btn.ghost{color:var(--accent-text);min-height:46px}
.btn.danger{background:color-mix(in srgb,var(--neg) 16%,var(--surface));color:var(--neg);border:1px solid color-mix(in srgb,var(--neg) 35%,transparent)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.field{display:flex;flex-direction:column;gap:7px}
.field>label,.lbl{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.input{width:100%;min-height:52px;border-radius:var(--r-sm);background:var(--bg-2);border:1.5px solid var(--line-strong);padding:0 16px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
:root[data-theme=light] .input{background:var(--surface-2)}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.input[aria-invalid=true]{border-color:var(--neg)}
.input:disabled{opacity:.5}
.err{color:var(--neg);font-size:13.5px;font-weight:600;min-height:0}
.amount-box{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:6px 0 2px}
.amount-box .cur{font-family:var(--font-display);font-size:30px;color:var(--faint);font-weight:600}
.amount-box input{background:none;border:0;outline:0;font-family:var(--font-display);font-size:46px;font-weight:600;letter-spacing:-.02em;width:2.2ch;min-width:2.2ch;max-width:calc(100vw - 110px);text-align:left;font-variant-numeric:tabular-nums;color:var(--text);padding:0;border-bottom:2px solid var(--line-strong);border-radius:0;transition:border-color .15s}
.amount-box input:focus{border-bottom-color:var(--accent)}
.amount-box input[aria-invalid=true]{border-bottom-color:var(--neg)}
.amount-box input::placeholder{color:var(--faint);opacity:.6}
.date-input{appearance:none;-webkit-appearance:none}

/* ---------- layers: sheets, pages, dialogs, toast ---------- */
#layers{position:absolute;inset:0;pointer-events:none;z-index:20}
.layer{position:absolute;inset:0;pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s}
.layer.in .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - 26px);display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;border-top:1px solid var(--line-strong);box-shadow:var(--shadow-pop);transform:translateY(102%);transition:transform .3s var(--ease)}
.layer.in .sheet{transform:none}
.sheet:focus{outline:none}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line-strong);margin:9px auto 0;flex:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px 4px 20px;flex:none}
.sheet-h h2{font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:-.01em}
.sheet-f{flex:none;padding:12px 20px calc(14px + var(--sab));border-top:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:8px}
.sheet-b{overflow-y:auto;padding:8px 20px 22px;display:flex;flex-direction:column;gap:18px;-webkit-overflow-scrolling:touch}
.page{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .32s var(--ease)}
.layer.in .page{transform:none}
.page:focus{outline:none}
.page-h{display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 10px) 14px 8px;flex:none}
.page-h h2{font-family:var(--font-display);font-size:24px;font-weight:600;letter-spacing:-.01em}
.page-b{flex:1;overflow-y:auto;padding:8px 18px calc(40px + var(--sab));display:flex;flex-direction:column;gap:14px}
.dialog-layer{display:grid;place-items:center;padding:24px}
.dialog{position:relative;width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-lg);padding:24px 22px 18px;box-shadow:0 30px 80px rgba(0,0,0,.55);transform:translateY(14px) scale(.97);opacity:0;transition:transform .28s var(--ease),opacity .2s}
.layer.in .dialog{transform:none;opacity:1}
.dialog:focus{outline:none}
.dialog h2{font-family:var(--font-display);font-size:22px;font-weight:600;margin-bottom:8px}
.dialog p{color:var(--muted);font-size:15px;line-height:1.5}
.dialog .acts{display:flex;flex-direction:column;gap:8px;margin-top:20px}
#toast{position:absolute;left:14px;right:14px;bottom:calc(92px + var(--sab));z-index:40;display:flex;justify-content:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;max-width:100%;padding:12px 14px 12px 18px;border-radius:18px;background:var(--surface-3);border:1px solid var(--line-strong);box-shadow:0 18px 40px -12px rgba(0,0,0,.6);font-size:14.5px;font-weight:550;animation:toastIn .3s var(--ease)}
.toast.bad{border-color:color-mix(in srgb,var(--neg) 55%,transparent)}
.toast.warn{border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.toast button{color:var(--accent-text);font-weight:750;min-height:40px;padding:0 6px}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
body.layers-open #toast{z-index:60}

/* ---------- info popover ---------- */
.info{display:inline-grid;place-items:center;width:44px;height:44px;margin:-14px -6px -14px 0;border-radius:50%;color:var(--faint);vertical-align:middle}
.info[aria-expanded=true]{color:var(--accent-text);background:var(--surface-2)}
.pop{margin-top:8px;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-3);border:1px solid var(--line-strong);font-size:14px;line-height:1.5;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}

/* ---------- misc ---------- */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px;border-radius:var(--r);background:color-mix(in srgb,var(--accent) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);margin-bottom:14px}
.banner.bad{background:color-mix(in srgb,var(--neg) 11%,var(--surface));border-color:color-mix(in srgb,var(--neg) 40%,transparent)}
.banner .mid{flex:1 1 170px;font-size:14px;line-height:1.35}
.banner .mid b{display:block;font-size:15px}
.banner .btn{min-height:42px;padding:0 16px;font-size:14px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:34px 22px}
.empty .badge{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent-text);margin-bottom:4px}
.empty h3{font-family:var(--font-display);font-size:21px;font-weight:600}
.empty p{color:var(--muted);font-size:14.5px;max-width:300px}
.search{position:relative}
.search .ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search .input{padding-left:44px;border-radius:99px;min-height:48px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:none;min-height:40px;font-size:14px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:44px;height:44px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#10121A;border:3px solid transparent;box-shadow:0 0 0 1px var(--line-strong)}
.sw[aria-checked=true]{border-color:var(--surface);box-shadow:0 0 0 2.5px var(--text)}
.sw .ico{width:20px;height:20px;opacity:0}
.sw[aria-checked=true] .ico{opacity:1}
.icopick{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
.icopick button{height:48px;border-radius:14px;background:var(--surface-2);border:1.5px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.icopick button[aria-checked=true]{border-color:var(--accent);color:var(--accent-text);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.daygrid button{min-height:44px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font-weight:650;font-variant-numeric:tabular-nums;color:var(--muted)}
.daygrid button[aria-pressed=true]{background:linear-gradient(145deg,var(--accent),var(--accent-2));color:var(--accent-ink);border-color:transparent}
.setrow{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:60px;width:100%;text-align:left}
.setrow + .setrow{border-top:1px solid var(--line)}
.setrow .mid{flex:1;min-width:0}
.setrow .t{font-weight:600;font-size:15.5px}
.setrow .s{font-size:13px;color:var(--muted);margin-top:1px}
.setrow .v{color:var(--muted);font-size:14.5px;font-weight:600;white-space:nowrap}
.setrow .ico.lead{color:var(--accent-text)}
.group-h{margin:12px 4px -4px}
.note-text{font-size:13px;color:var(--faint);line-height:1.5;padding:0 6px}
.arch{opacity:.55}

/* ---------- onboarding / recovery gate ---------- */
.gate{position:absolute;inset:0;z-index:10;background:var(--bg);overflow-y:auto;padding:calc(var(--sat) + 36px) 22px calc(28px + var(--sab));display:flex;flex-direction:column;gap:22px;
  background-image:radial-gradient(90% 40% at 100% 0%,var(--hero-glow),transparent 70%)}
/* ---------- passcode lock ---------- */
.top-r{display:flex;gap:10px}
.lockscreen{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:14px;padding:calc(var(--sat) + 36px) 22px calc(20px + var(--sab));overflow-y:auto;
  background-image:radial-gradient(90% 40% at 100% 0%,var(--hero-glow),transparent 70%)}
.lockscreen:focus{outline:none}
.lockscreen.shield{z-index:40;justify-content:flex-start}
.lock-body{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:360px}
.lock-body h1,.pinwrap h1{font-family:var(--font-display);font-size:26px;letter-spacing:-.02em;font-weight:600;text-align:center}
.pinwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:8px}
.dots{display:flex;gap:14px;min-height:16px;justify-content:center}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);background:transparent;transition:background .12s,border-color .12s}
.dot.on{background:var(--accent);border-color:var(--accent)}
.dots.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.dots.shake{animation:none}}
.pin-err{min-height:20px;text-align:center}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:12px 18px;justify-content:center}
.key{width:72px;height:72px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:26px;font-weight:600;color:var(--text);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.key:active{background:var(--surface-3)}
.key:disabled{opacity:.45}
@media (max-height:640px){.keypad{gap:8px 16px}.key{width:60px;height:60px;font-size:22px}.keypad{grid-template-columns:repeat(3,60px)}}
.gate .brand{font-size:26px}
.gate h1{font-family:var(--font-display);font-size:38px;line-height:1.05;letter-spacing:-.03em;font-weight:600}
.gate .lead{color:var(--muted);font-size:16px;max-width:340px}
.gate .spacer{flex:1}

@media (hover:hover){
  .row:hover{background:var(--surface-2)} .chip:hover{border-color:var(--line-strong)} .icon-btn:hover{background:var(--surface-2)}
  .btn.soft:hover{filter:brightness(1.1)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

  let list = sortedTx();
  if (!q) list = list.filter(t => t.date >= p.start && t.date <= p.end);
  if (f.type !== 'all') list = list.filter(t => t.type === (f.type === 'in' ? 'in' : 'out'));
  if (f.cat) list = list.filter(t => t.cat === f.cat);
  if (q) list = list.filter(t => [t.note, catById(t.cat).name, (acctById(t.acct) || {}).name || '', minorToInput(t.amount)].join(' ').toLowerCase().includes(q));
  if (!list.length) return emptyState(q ? 'search' : 'list', q ? 'No matches' : 'No records here', q ? 'Try a different word, or clear the filters.' : 'Nothing was recorded in this period.');
  /* Long histories are shown in pages of whole days so the screen stays fast. */
  const groups = []; let cur = null, shown = 0; const cap = f.limit || PAGE;
  for (const t of list) {
    if (!cur || cur.date !== t.date) { if (shown >= cap) break; cur = { date: t.date, items: [] }; groups.push(cur); }

}

/* ---------------- INSIGHTS ---------------- */
function trendSVG(p) {
  const sd = S.settings.monthStart, data = [];
  for (let i = 5; i >= 0; i--) { const per = periodOf(shiftKey(p.key, -i), sd), s = summarize(per); data.push({ lab: MONTHS[parseYmd(per.start).m], inc: s.income, out: s.spent, cur: i === 0 }); }
  const max = Math.max(1, ...data.flatMap(d => [d.inc, d.out])), W = 320, H = 150, base = 124, top = 14, bw = 15, gap = 4, step = W / 6;
  let g = '';
  data.forEach((d, i) => {
    const x = i * step + step / 2 - bw - gap / 2, hi = Math.max(d.inc ? 3 : 0, (d.inc / max) * (base - top)), ho = Math.max(d.out ? 3 : 0, (d.out / max) * (base - top));
    g += `<rect x="${x}" y="${base - hi}" width="${bw}" height="${hi}" rx="4" fill="var(--pos)" opacity="${d.cur ? 1 : .55}"/><rect x="${x + bw + gap}" y="${base - ho}" width="${bw}" height="${ho}" rx="4" fill="var(--accent)" opacity="${d.cur ? 1 : .55}"/>
      <text x="${i * step + step / 2}" y="144" text-anchor="middle" font-size="11" font-weight="${d.cur ? 700 : 500}" fill="${d.cur ? 'var(--text)' : 'var(--faint)'}">${d.lab}</text>`;
  });
  const desc = data.map(d => `${d.lab}: received ${money(d.inc)}, spent ${money(d.out)}`).join('. ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Received and spent over the last 6 periods. ${esc(desc)}"><line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line-strong)"/>${g}</svg>`;
}
function viewInsights() {
  const p = selPeriod(), sd = S.settings.monthStart, sum = summarize(p), t0 = todayStr();
  /* While a period is still running, compare it with the same number of days of the last one. */
  let prevP = periodOf(shiftKey(p.key, -1), sd); const partial = p.start <= t0 && t0 <= p.end;
  if (partial) { const upto = addDays(prevP.start, diffDays(p.start, t0)); if (upto < prevP.end) prevP = Object.assign({}, prevP, { end: upto }); }
  const prev = summarize(prevP);
  const rows = Object.keys(sum.byCat).map(id => ({ c: catById(id), v: sum.byCat[id] })).sort((a, b) => b.v - a.v);
  let delta = '';
  if (prev.spent > 0 && sum.spent > 0) {
    const d = Math.round((sum.spent - prev.spent) / prev.spent * 100);
    delta = `<span class="pill ${d > 0 ? 'over' : 'ok'}">${d === 0 ? (partial ? 'Same as this time last period' : 'Same as last period') : `${Math.abs(d)}% ${d > 0 ? 'more' : 'less'} than ${partial ? 'this time last period' : 'last period'}`}</span>`;
  }
  const net = sum.income - sum.spent;
  return `<div class="screen"><div class="top"><h1 class="h-title">Insights</h1>${gear()}</div>${periodNav()}
    ${!S.transactions.length ? `<div class="card">${emptyState('chart', 'Nothing to show yet', 'Once you record a few transactions, you will see where your money goes.')}</div>` : `
    <section class="card" style="padding:18px 18px 16px"><div class="eyebrow">Net this period</div>
      <div class="display ${net < 0 ? 'neg' : net > 0 ? 'pos' : ''}" style="font-size:34px;margin:4px 0 10px">${money(net, { plus: net > 0 })}</div>${delta}
      <div class="stat-row"><div class="stat"><span class="k">Received</span><span class="v pos">${money(sum.income)}</span></div><div class="stat"><span class="k">Spent</span><span class="v">${money(sum.spent)}</span></div></div></section>
    <div class="sec-h"><h2 class="eyebrow">Where it went</h2></div>
    <section class="card" style="padding:16px 16px 6px">${rows.length ? `<div class="stackbar" role="img" aria-label="Spending split by category">${rows.map(r => `<i style="width:${(r.v / sum.spent * 100).toFixed(2)}%;background:${esc(r.c.color)}"></i>`).join('')}</div>
      <div class="list" style="margin-top:8px">${rows.map(r => `<div class="row" style="min-height:58px;padding-left:0;padding-right:0"><span class="tile" style="--c:${esc(r.c.color)}">${ico(r.c.icon, 20)}</span><span class="mid"><span class="t">${esc(r.c.name)}</span><span class="s">${Math.round(r.v / sum.spent * 100)}% of spending</span></span><span class="r">${money(r.v)}</span></div>`).join('')}</div>` : `<p class="muted" style="padding:6px 4px 14px;font-size:14.5px">No spending in this period.</p>`}</section>
    <div class="sec-h"><h2 class="eyebrow">Last 6 periods</h2></div>
    <section class="card chart-card"><div class="legend"><span><b style="background:var(--pos)"></b>Received</span><span><b style="background:var(--accent)"></b>Spent</span></div>${trendSVG(p)}</section>`}
  </div>`;
}

/* ---------------- RENDER ---------------- */

  $('#tabbar').innerHTML = TABS.map(t => t ? `<button type="button" class="tab" data-tab="${t[0]}" ${ui.tab === t[0] ? 'aria-current="page"' : ''}>${ico(t[2], 23)}<span>${t[1]}</span></button>` : `<button type="button" class="fab" data-act="add" aria-label="Add a record">${ico('plus', 28)}</button>`).join('');

/* view-level events */
$('#view').addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab],[data-edit],[data-limit],[data-newlimit],[data-ftype],[data-fcat],[data-more]');
  if (!t) return;
  const d = t.dataset;
  if (t.hasAttribute('data-more')) { ui.filter.limit = (ui.filter.limit || PAGE) + PAGE; $('#actlist').innerHTML = activityList(); return; }
  if (d.edit) return openTxSheet(d.edit);
  if (d.tab) return setTab(d.tab);
  if (d.limit) return openLimitSheet(d.limit);
  if (d.newlimit) return openLimitSheet(d.newlimit, true);
  if (d.ftype) { ui.filter.type = d.ftype; ui.filter.limit = 0; return render(); }
  if (d.fcat) { ui.filter.cat = ui.filter.cat === d.fcat ? null : d.fcat; ui.filter.limit = 0; return render(); }
  switch (d.act) {
    case 'prev': ui.offset--; ui.filter.limit = 0; ringPrev = null; render(); break;
    case 'next': if (ui.offset < maxOffset()) { ui.offset++; ui.filter.limit = 0; ringPrev = null; render(); } break;
    case 'more': ui.filter.limit = (ui.filter.limit || PAGE) + PAGE; $('#actlist').innerHTML = activityList(); break;
    case 'add': openTxSheet(null); break;
    case 'settings': openSettings(); break;
    case 'locknow': lock(); break;
    case 'newlimit': openLimitSheet(null, true); break;
    case 'backup': doBackup(); break;
    case 'snooze': S.settings.remindAfter = Date.now() + 3 * 864e5; commit(); break;
    case 'apply-update': applyUpdate(); break;
  }
});
$('#view').addEventListener('input', e => {
  if (e.target.id === 'q') { ui.filter.q = e.target.value; ui.filter.limit = 0; $('#actlist').innerHTML = activityList(); const pn = $('#view .period'); if (pn) pn.style.display = e.target.value.trim() ? 'none' : ''; }
});
$('#tabbar').addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-act]'); if (!t) return;
  if (t.dataset.act === 'add') return openTxSheet(null);

});
/* =====================================================================
   6. FLOWS: record sheet, limits, settings, categories, accounts
   ===================================================================== */
const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10 > 3 ? 0 : n % 10] || 'th');
function fmtAmountInput(str) {
  const dec = curDigits(S.settings.currency) !== 0, v = String(str).replace(/[^\d.]/g, '');
  let [i, ...rest] = v.split('.'); let f = rest.join('').slice(0, 2);
  i = i.replace(/^0+(?=\d)/, '').slice(0, 11);
  return i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (dec && v.includes('.') ? '.' + f : '');
}
/* Sizes the amount box to its text and shrinks the type for long numbers so nothing is ever cut off. */
const sizeAmount = input => {
  const len = Math.max(2, input.value.length), avail = Math.min(window.innerWidth - 130, 340);
  input.style.fontSize = Math.max(22, Math.min(46, avail / ((len + 0.6) * 0.62))) + 'px';
  input.style.width = len + 0.6 + 'ch';
};
function bindAmountInput(input, errEl, autosize = false) {
  input.addEventListener('input', () => { input.value = fmtAmountInput(input.value); input.removeAttribute('aria-invalid'); if (errEl) errEl.textContent = ''; if (autosize) sizeAmount(input); });
  if (autosize) sizeAmount(input);
}
function failField(input, errEl, msg) { if (errEl) errEl.textContent = msg; if (input) { input.setAttribute('aria-invalid', 'true'); input.focus(); } }

function limitNotice(tx) {
  if (tx.type !== 'out') return null;
  const sd = S.settings.monthStart, sum = summarize(periodOf(keyFor(tx.date, sd), sd)), found = [];
  const test = (id, name) => {
    const L = S.limits[id]; if (!L) return;
    const after = id === '_all' ? sum.spent : (sum.byCat[id] || 0), before = after - tx.amount;
    if (before <= L && after > L) found.push({ sev: 2, msg: `Over your ${name} limit by ${money(after - L)}` });
    else if (before < L * 0.8 && after >= L * 0.8 && after <= L) found.push({ sev: 1, msg: `${name} is at ${Math.round(after / L * 100)}% of its limit` });
  };
  test(tx.cat, catById(tx.cat).name); test('_all', 'overall');
  found.sort((a, b) => b.sev - a.sev);
  return found[0] || null;
}

/* ---------------- record sheet (add / edit) ---------------- */
function openTxSheet(id) {
  const editing = id ? S.transactions.find(t => t.id === id) : null;
  if (id && !editing) return;
  const st = { type: editing ? editing.type : 'out', cat: editing ? editing.cat : null, acct: editing ? editing.acct : null };
  const defCat = type => {
    const last = sortedTx().find(t => t.type === type && !catById(t.cat).archived);
    if (last) return last.cat;
    const c = S.categories.find(c => c.kind === (type === 'in' ? 'income' : 'expense') && !c.archived); return c ? c.id : null;
  };
  if (!st.cat) st.cat = defCat(st.type);
  let root = null;
  const sym = curSymbol(S.settings.currency);
  const body = `
    <div class="seg" role="group" aria-label="Record type"><button type="button" data-kind="out" data-type="out">${ico('arrowUp', 18)}Spent</button><button type="button" data-kind="in" data-type="in">${ico('arrowDown', 18)}Received</button></div>
    <div><div class="amount-box"><span class="cur" aria-hidden="true">${esc(sym)}</span><input id="f-amt" inputmode="${curDigits(S.settings.currency) === 0 ? 'numeric' : 'decimal'}" autocomplete="off" aria-label="Amount" placeholder="0" data-autofocus></div><div class="err" id="f-err" role="alert" style="text-align:center"></div></div>
    <div class="field"><span class="lbl">Category</span><div id="f-cats" class="chips" role="radiogroup" aria-label="Category"></div></div>
    <div class="field"><div class="row2"><div class="field"><label for="f-date">Date</label><input id="f-date" class="input date-input" type="date" min="1970-01-01" max="2200-12-31"></div><div class="field"><label for="f-time">Time</label><input id="f-time" class="input date-input" type="time"></div></div>
      <div class="chips" id="f-quick" style="margin-top:2px"><button type="button" class="chip" data-q="0">Today</button><button type="button" class="chip" data-q="-1">Yesterday</button></div></div>
    <div class="field"><label for="f-note">Note (optional)</label><input id="f-note" class="input" type="text" maxlength="200" autocomplete="off" enterkeyhint="done"></div>
    <div class="field"><span class="lbl">Bank or account (optional) ${infoBtn('Tag the bank or wallet you used. It is only for your own reference, and you can leave it empty.')}</span><div id="f-accts" class="chips" role="radiogroup" aria-label="Bank or account"></div></div>
    ${editing ? `<button type="button" class="btn danger block" id="f-del">${ico('trash', 19)}Delete record</button>${editing.createdAt ? `<p class="note-text" style="text-align:center">Added ${esc(fmtStamp(editing.createdAt))}</p>` : ''}` : ''}`;
  const footer = `<button type="button" class="btn primary block" id="f-save">${editing ? 'Save changes' : 'Save record'}</button>`;
  const drawCats = () => {
    const kind = st.type === 'in' ? 'income' : 'expense';
    const cats = S.categories.filter(c => c.kind === kind && (!c.archived || c.id === st.cat));
    $('#f-cats', root).innerHTML = cats.map(c => `<button type="button" class="chip cat" role="radio" aria-checked="${st.cat === c.id}" data-cat="${esc(c.id)}" style="--c:${esc(c.color)}">${ico(c.icon, 18)}${esc(c.name)}</button>`).join('');
  };
  const drawAccts = () => {
    if (st.acct && !acctById(st.acct)) st.acct = null;
    $('#f-accts', root).innerHTML = `<button type="button" class="chip" role="radio" aria-checked="${!st.acct}" data-acct="">None</button>` +
      S.accounts.map(a => `<button type="button" class="chip" role="radio" aria-checked="${st.acct === a.id}" data-acct="${esc(a.id)}">${ico('bank', 18)}${esc(a.name)}</button>`).join('') +
      `<button type="button" class="chip" data-newacct>${ico('plus', 18)}New</button>`;
  };
  const drawType = () => {
    $$('[data-type]', root).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.type === st.type)));
    drawCats();
  };
  const drawQuick = () => {
    const v = $('#f-date', root).value;
    $$('[data-q]', root).forEach(b => b.setAttribute('aria-pressed', String(v === addDays(todayStr(), +b.dataset.q))));
  };
  openSheet({
    title: editing ? 'Edit record' : 'New record', body, footer,
    refresh: () => { if (root) drawAccts(); },
    onMount: el => {
      root = el;
      const amt = $('#f-amt', el), err = $('#f-err', el), dateEl = $('#f-date', el), timeEl = $('#f-time', el), note = $('#f-note', el);
      bindAmountInput(amt, err, true);
      dateEl.value = editing ? editing.date : todayStr();
      timeEl.value = editing ? (editing.time || '') : nowTime();
      if (editing) { amt.value = fmtAmountInput(minorToInput(editing.amount)); sizeAmount(amt); note.value = editing.note || ''; }
      drawType(); drawAccts(); drawQuick();
      dateEl.addEventListener('input', drawQuick);
      el.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        if (b.dataset.type) { if (st.type !== b.dataset.type) { st.type = b.dataset.type; st.cat = defCat(st.type); drawType(); } }
        else if (b.dataset.cat) { st.cat = b.dataset.cat; drawCats(); }
        else if (b.dataset.q) { dateEl.value = addDays(todayStr(), +b.dataset.q); drawQuick(); }
        else if (b.dataset.acct !== undefined) { st.acct = b.dataset.acct || null; drawAccts(); }
        else if (b.hasAttribute('data-newacct')) openAccountSheet({ onDone: nid => { st.acct = nid; drawAccts(); } });
        else if (b.id === 'f-save') save();
        else if (b.id === 'f-del') del();
      });
      el.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.id !== 'f-date' && e.target.id !== 'f-time') { e.preventDefault(); save(); } });
      let busy = false;   // a second tap while the sheet is closing must not save twice
      function save() {
        if (busy) return;
        const r = parseAmount(amt.value);
        if (!r.ok) return failField(amt, err, r.error);
        if (!st.cat) return toast('Add a category first, in Settings.', { kind: 'bad' });
        if (!validYmd(dateEl.value)) return toast('Choose a valid date.', { kind: 'bad' });
        const fields = { type: st.type, amount: r.minor, cat: st.cat, acct: st.acct || null, date: dateEl.value, time: /^([01]\d|2[0-3]):[0-5]\d$/.test(timeEl.value) ? timeEl.value : null, note: note.value.trim().slice(0, 200) };
        busy = true;
        let notice = null;
        if (editing) Object.assign(editing, fields, { updatedAt: Date.now() });
        else { const t = Object.assign({ id: uid(), createdAt: Date.now(), updatedAt: Date.now() }, fields); S.transactions.push(t); notice = limitNotice(t); }
        commit();
        closeLayer().then(() => {
          if (!storageOK) toast('Saved on screen only. Your browser could not store it.', { kind: 'bad', ms: 6000 });
          else if (notice) toast(notice.msg, { kind: 'warn', ms: 5200 });
          else toast(editing ? 'Changes saved' : st.type === 'in' ? 'Income recorded' : 'Expense recorded');
        });
      }
      function del() {
        if (busy) return; busy = true;
        const copy = Object.assign({}, editing);
        S.transactions = S.transactions.filter(t => t.id !== editing.id);
        commit();
        closeLayer().then(() => toast('Record deleted', { action: { label: 'Undo', fn: () => { S.transactions.push(copy); commit(); toast('Record restored'); } }, ms: 6000 }));
      }
    }
  });
}

/* ---------------- new bank / account ---------------- */
function openAccountSheet({ id = null, onDone = null } = {}) {
  const a = id ? acctById(id) : null;
  const used = a ? S.transactions.filter(t => t.acct === a.id).length : 0;
  openSheet({
    title: a ? 'Edit bank or account' : 'New bank or account',
    body: `<div class="field"><label for="a-name">Name</label><input id="a-name" class="input" type="text" maxlength="40" autocomplete="off" data-autofocus enterkeyhint="done" value="${a ? esc(a.name) : ''}"><div class="err" id="a-err" role="alert"></div></div>
      ${a ? `<button type="button" class="btn danger block" id="a-del">${ico('trash', 19)}Remove</button>` : ''}`,
    footer: '<button type="button" class="btn primary block" id="a-save">Save</button>',
    onMount: el => {
      const inp = $('#a-name', el), err = $('#a-err', el);
      inp.addEventListener('input', () => { inp.removeAttribute('aria-invalid'); err.textContent = ''; });
      let busy = false;
      const save = () => {
        if (busy) return;
        const name = inp.value.trim();
        if (!name) return failField(inp, err, 'Enter a name.');
        if (S.accounts.some(x => x.id !== (a && a.id) && x.name.toLowerCase() === name.toLowerCase())) return failField(inp, err, 'You already have one with this name.');
        busy = true;
        let nid;
        if (a) { a.name = name; nid = a.id; } else { nid = uid(); S.accounts.push({ id: nid, name }); }
        commit(); closeLayer().then(() => { if (onDone) onDone(nid); });
      };
      el.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target === inp) { e.preventDefault(); save(); } });
      el.addEventListener('click', async e => {
        const b = e.target.closest('button'); if (!b) return;
        if (b.id === 'a-save') save();
        if (b.id === 'a-del') {
          const ok = await dialog({ title: `Remove ${a.name}?`, body: used ? `${used} record${used === 1 ? '' : 's'} will stay in your history but will no longer show this bank.` : 'This bank has no records attached to it.', actions: [{ label: 'Remove', kind: 'danger', value: true }, { label: 'Keep it', kind: 'soft', value: false }] });
          if (!ok) return;
          S.transactions.forEach(t => { if (t.acct === a.id) t.acct = null; });
          S.accounts = S.accounts.filter(x => x.id !== a.id); commit(); closeLayer();
        }
      });
    }
  });
}

/* ---------------- limits ---------------- */
function openLimitSheet(id, isNew = false) {
  const st = { id: id || null };
  const exists = id && S.limits[id];
  const avail = () => [].concat(S.limits._all ? [] : [{ id: '_all', name: 'Overall', icon: 'wallet', color: '#F0B45A' }], spendCats().filter(c => !c.archived && !S.limits[c.id]));
  const picking = !id;
  const body = `${picking ? `<div class="field"><span class="lbl">What should it cover?</span><div class="chips" id="l-pick" role="radiogroup" aria-label="Limit applies to">${avail().map(c => `<button type="button" class="chip cat" role="radio" aria-checked="false" data-pick="${esc(c.id)}" style="--c:${esc(c.color)}">${ico(c.icon, 18)}${esc(c.name)}</button>`).join('')}</div></div>` : ''}
    <div class="field"><label for="l-amt">Limit per period</label><div class="amount-box" style="justify-content:flex-start"><span class="cur" aria-hidden="true">${esc(curSymbol(S.settings.currency))}</span><input id="l-amt" inputmode="${curDigits(S.settings.currency) === 0 ? 'numeric' : 'decimal'}" autocomplete="off" placeholder="0" ${picking ? '' : 'data-autofocus'} style="text-align:left;max-width:none"></div><div class="err" id="l-err" role="alert"></div><div class="note-text" id="l-hint"></div></div>
    ${exists ? `<button type="button" class="btn danger block" id="l-del">${ico('trash', 19)}Remove limit</button>` : ''}`;
  const title = !id ? 'New limit' : id === '_all' ? 'Overall limit' : `${catById(id).name} limit`;
  openSheet({
    title, body, footer: '<button type="button" class="btn primary block" id="l-save">Save limit</button>',
    onMount: el => {
      const amt = $('#l-amt', el), err = $('#l-err', el), hint = $('#l-hint', el);
      bindAmountInput(amt, err, true);
      if (exists) { amt.value = fmtAmountInput(minorToInput(S.limits[id])); sizeAmount(amt); }
      const showHint = () => {
        if (!st.id) { hint.textContent = ''; return; }
        const sd = S.settings.monthStart, prev = summarize(periodOf(shiftKey(currentKey(), -1), sd));
        const v = st.id === '_all' ? prev.spent : (prev.byCat[st.id] || 0);
        hint.textContent = v > 0 ? `Last period you spent ${money(v)}${st.id === '_all' ? '' : ' here'}.` : '';
      };
      showHint();
      let busy = false;
      el.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b || busy) return;
        if (b.dataset.pick) { st.id = b.dataset.pick; $$('[data-pick]', el).forEach(x => x.setAttribute('aria-checked', String(x === b))); showHint(); amt.focus(); }
        else if (b.id === 'l-save') {
          if (!st.id) return failField(null, err, 'Choose what the limit covers.');
          const r = parseAmount(amt.value); if (!r.ok) return failField(amt, err, r.error);
          busy = true; S.limits[st.id] = r.minor; commit(); closeLayer().then(() => toast('Limit saved'));
        } else if (b.id === 'l-del') {
          busy = true; const old = S.limits[id]; delete S.limits[id]; commit();
          closeLayer().then(() => toast('Limit removed', { action: { label: 'Undo', fn: () => { S.limits[id] = old; commit(); } }, ms: 6000 }));
        }
      });
      el.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target === amt) { e.preventDefault(); $('#l-save', el).click(); } });
    }
  });
}

async function changeCurrency(code) {

function openCategorySheet(id) {

    onMount: el => {
      const name = $('#c-name', el), err = $('#c-err', el);
      name.addEventListener('input', () => { name.removeAttribute('aria-invalid'); err.textContent = ''; });
      const sync = () => {
        $$('[data-k]', el).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === st.kind)));
        $$('[data-i]', el).forEach(b => b.setAttribute('aria-checked', String(b.dataset.i === st.icon)));

      }; sync();
      let busy = false;
      el.addEventListener('click', async e => {

        if (b.dataset.k) { st.kind = b.dataset.k; sync(); }
        else if (b.dataset.i) { st.icon = b.dataset.i; sync(); }

          if (S.categories.some(x => x.id !== (c && c.id) && x.kind === st.kind && x.name.toLowerCase() === n.toLowerCase())) return failField(name, err, 'You already have a category with this name.');
          busy = true;
          if (c) Object.assign(c, { name: n, icon: st.icon, color: st.color }); else S.categories.push({ id: uid(), name: n, icon: st.icon, color: st.color, kind: st.kind, archived: false });

          const ok = await dialog({ title: `Delete ${c.name}?`, body: 'This cannot be undone.', actions: [{ label: 'Delete', kind: 'danger', value: true }, { label: 'Keep it', kind: 'soft', value: false }] });
          if (!ok) return;

      el.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target === name) { e.preventDefault(); $('#c-save', el).click(); } });
    }
  });
}

function lastBackupText() {
  const t = S.settings.lastBackupAt; if (!t) return 'Never backed up';

  return d <= 0 ? 'Backed up today' : d === 1 ? 'Backed up yesterday' : `Backed up ${d} days ago`;
}

}

      if (r.ok) { unlock(); return; }
      pad.shake(); pad.clear();
      if (r.wait) showWait(r.wait); else { pad.disable(false); pad.error(`Wrong passcode. ${r.left} ${r.left === 1 ? 'try' : 'tries'} left before a pause.`); }
    }
  });
  if (!broken) { activePad = pad; if (lockCfg.lockoutUntil > Date.now()) showWait(lockCfg.lockoutUntil - Date.now()); }
  el.addEventListener('click', e => { if (e.target.closest('[data-forgot]')) showForgot(); });
  function showForgot() {
    stopCount(); activePad = null;
    el.innerHTML = `<div class="brand"><i aria-hidden="true"></i>Purse</div><div class="lock-body"><h1>Reset Purse?</h1><p class="muted" style="text-align:center;max-width:320px;line-height:1.5">Purse cannot recover a forgotten passcode, because it is never stored. To get back in, all records on this phone must be erased and the passcode removed. If you have a backup file, you can restore it afterwards.</p></div>
      <div class="stack" style="width:100%;max-width:360px"><button type="button" class="btn danger block" data-wipe>Erase everything and reset</button><button type="button" class="btn soft block" data-back>Go back</button></div>`;
    el.focus({ preventScroll: true });
    el.onclick = e => {
      if (e.target.closest('[data-back]')) { lockEl.remove(); lockEl = null; showLockScreen(); }
      else if (e.target.closest('[data-wipe]')) wipeEverything();
    };
  }
  el.focus({ preventScroll: true });
}
function unlock() {
  locked = false; clearInterval(lockCountdown); lockCountdown = null; activePad = null;
  if (lockEl) { lockEl.remove(); lockEl = null; }
  lastActive = Date.now(); persistActive(true);
  updateInert();
  const go = postUnlock; postUnlock = null; if (go) go(); else render();
}
function lock() {
  if (!lockCfg || locked) return;
  locked = true; lockCfg.lastActive = 0; saveLock();   // stored, so closing and reopening the app while locked stays locked
  while (layers.length) removeLayer(layers.pop());
  history.replaceState({ d: 0, tab: ui.tab }, '');
  $('#toast').innerHTML = ''; $('#view').innerHTML = ''; $('#tabbar').innerHTML = '';
  hideShield(); showLockScreen(); updateInert();
}
/* Used by "Forgot passcode": removes every trace of the records, then returns to first-run setup. */
function wipeEverything() {
  [KEY, KEY_PREV, KEY_UNDO, KEY_CORRUPT, KEY_LOCK].forEach(k => { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } });
  lockCfg = null; locked = false; clearInterval(lockTimer); lockTimer = null; clearInterval(lockCountdown); lockCountdown = null; activePad = null;
  if (lockEl) { lockEl.remove(); lockEl = null; }
  S = freshState(); persist();
  afterDataSwap(); showWelcomeGate();
  toast('Purse was reset');
}

/* ---------- privacy cover (so the phone's app switcher never shows your records) ---------- */
function showShield() { if (shieldEl || locked) return; shieldEl = document.createElement('div'); shieldEl.className = 'lockscreen shield'; shieldEl.innerHTML = '<div class="brand"><i aria-hidden="true"></i>Purse</div>'; $('#app').appendChild(shieldEl); }
function hideShield() { if (shieldEl) { shieldEl.remove(); shieldEl = null; } }

/* ---------- when to lock ---------- */
function idleLimit() { return lockCfg && !lockCfg.broken && lockCfg.timeout > 0 ? lockCfg.timeout * 60000 : 0; }
function lockIfIdle() {
  if (!lockCfg || locked || lockPause > 0) return;
  const lim = idleLimit(), gap = Date.now() - lastActive;
  if (lim && (gap >= lim || gap < 0)) lock();        // gap < 0: the clock was moved back, so be safe
}
function noteActivity() { lastActive = Date.now(); }
['pointerdown', 'keydown', 'touchstart', 'scroll', 'input'].forEach(ev => document.addEventListener(ev, noteActivity, { capture: true, passive: true }));
function startLockWatch() {
  if (lockTimer) return;
  lockTimer = setInterval(() => { if (!lockCfg) return; lockIfIdle(); if (!locked) persistActive(false); }, 5000);
}
document.addEventListener('visibilitychange', () => {
  if (!lockCfg) return;
  if (document.hidden) {
    lastActive = Date.now(); persistActive(true);
    if (!locked && lockPause === 0 && lockCfg.timeout === 0) lock(); else showShield();
  } else {
    hideShield();
    if (lockPause > 0) { lastActive = Date.now(); return; }
    lockIfIdle();
  }
});
window.addEventListener('pagehide', () => { if (lockCfg && !locked) { lastActive = Date.now(); persistActive(true); } });
/* The phone's file picker and share sheet take the app to the background. Do not lock because of those. */
async function withoutAutoLock(promise) { lockPause++; try { return await promise; } finally { lastActive = Date.now(); setTimeout(() => { lockPause = Math.max(0, lockPause - 1); }, 1500); } }

/* ---------- setup, change, turn off ---------- */
function openPinSetup({ title, onDone }) {
  let first = null, root, pad;
  const body = `<div class="pinwrap"><p class="muted" data-help style="text-align:center">Choose ${PIN_MIN} to ${PIN_MAX} digits.</p>${padHTML(PIN_MAX)}<button type="button" class="btn primary block" data-next disabled style="max-width:360px">Continue</button></div>`;
  openPage({
    title, body,
    onClose: () => { if (activePad === pad) activePad = null; },
    onMount: el => {
      root = el;
      const next = $('[data-next]', el), help = $('[data-help]', el);
      pad = mountPad(el, {
        dots: PIN_MAX, max: PIN_MAX,
        onInput: d => {
          pad.error('');
          if (first === null) { next.disabled = d.length < PIN_MIN; return; }
          if (d.length < first.length) return;
          if (d === first) { const pin = first; pad.disable(true); closeLayer().then(() => onDone(pin)); }
          else { pad.shake(); pad.clear(); first = null; pad.setDots(PIN_MAX); help.textContent = `Those did not match. Choose ${PIN_MIN} to ${PIN_MAX} digits again.`; next.hidden = false; next.disabled = true; }
        }
      });
      activePad = pad;
      next.addEventListener('click', () => {
        if (pad.digits.length < PIN_MIN) return;
        first = pad.digits; pad.clear(); pad.setDots(first.length); help.textContent = 'Enter it again to confirm.'; next.hidden = true;
      });
    }
  });
}
function openPinVerify({ title, onOk }) {
  let pad;
  openPage({
    title, body: `<div class="pinwrap"><p class="muted" style="text-align:center">Enter your current passcode.</p>${padHTML(lockCfg.len)}</div>`,
    onClose: () => { if (activePad === pad) activePad = null; clearInterval(lockCountdown); lockCountdown = null; },
    onMount: el => {
      let busy = false;
      const showWait = () => {
        clearInterval(lockCountdown); pad.disable(true);
        const tick = () => { const left = lockCfg.lockoutUntil - Date.now(); if (left <= 0) { clearInterval(lockCountdown); lockCountdown = null; pad.error(''); pad.disable(false); return; } pad.error(`Too many tries. Try again in ${fmtWait(left)}.`); };
        tick(); lockCountdown = setInterval(tick, 500);
      };
      pad = mountPad(el, {
        dots: lockCfg.len, max: lockCfg.len,
        onInput: async d => {
          if (d.length < lockCfg.len || busy) return;
          busy = true; pad.disable(true);
          const r = await attemptPin(d); busy = false;
          if (r.ok) { closeLayer().then(onOk); return; }
          pad.shake(); pad.clear();
          if (r.wait) showWait(); else { pad.disable(false); pad.error(`Wrong passcode. ${r.left} ${r.left === 1 ? 'try' : 'tries'} left before a pause.`); }
        }
      });
      activePad = pad;
      if (lockCfg.lockoutUntil > Date.now()) showWait();
    }
  });
}
function lockChanged() { layers.forEach(l => l.refresh && l.refresh()); render(); }
function enableLock() {
  if (!lockSupported()) return toast('Passcode lock needs a secure connection (https).', { kind: 'bad' });
  openPinSetup({ title: 'Set a passcode', onDone: async pin => { lockCfg = await makeLock(pin); lastActive = Date.now(); saveLock(); startLockWatch(); lockChanged(); toast('Passcode lock is on'); } });
}
function changePasscode() {
  openPinVerify({ title: 'Change passcode', onOk: () => openPinSetup({ title: 'New passcode', onDone: async pin => { lockCfg = await makeLock(pin, lockCfg); saveLock(); lockChanged(); toast('Passcode changed'); } }) });
}
function disableLock() {
  openPinVerify({ title: 'Turn off lock', onOk: async () => {
    const ok = await dialog({ title: 'Turn off passcode lock?', body: 'Anyone who opens Purse on this phone will be able to see your records.', actions: [{ label: 'Turn off', kind: 'danger', value: true }, { label: 'Keep it on', kind: 'soft', value: false }] });
    if (!ok) return;
    try { localStorage.removeItem(KEY_LOCK); } catch (e) { /* ignore */ }
    lockCfg = null; clearInterval(lockTimer); lockTimer = null; hideShield(); lockChanged(); toast('Passcode lock is off');
  } });
}
function openAutoLockSheet() {
  openSheet({
    title: 'Lock the app',
    body: `<div class="card list" role="radiogroup" aria-label="When to lock">${LOCK_TIMEOUTS.map(([m, l]) => `<button type="button" class="row" role="radio" aria-checked="${lockCfg.timeout === m}" data-t="${m}"><span class="mid"><span class="t">${l}</span>${m === 0 ? '<span class="s">Also when you switch to another app</span>' : '<span class="s">When you have not touched Purse for this long</span>'}</span>${lockCfg.timeout === m ? `<span class="pos">${ico('check', 22)}</span>` : ''}</button>`).join('')}</div>`,
    onMount: el => el.addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (!b) return; lockCfg.timeout = +b.dataset.t; lastActive = Date.now(); saveLock(); closeLayer().then(() => { lockChanged(); toast(`Locks ${LOCK_TIMEOUTS.find(x => x[0] === lockCfg.timeout)[1].toLowerCase()}`); }); })
  });
}
/* =====================================================================
   8. FIRST RUN AND RECOVERY SCREENS
   ===================================================================== */
function showWelcomeGate() {
  const g = document.createElement('div'); g.className = 'gate'; g.setAttribute('role', 'region'); g.setAttribute('aria-label', 'Welcome to Purse');
  const st = { cur: S.settings.currency, day: S.settings.monthStart };
  const draw = () => {
    const curs = QUICK_CURRENCIES.includes(st.cur) ? QUICK_CURRENCIES : QUICK_CURRENCIES.concat(st.cur);
    const days = [1, 25, 28, 30];
    g.innerHTML = `<div class="brand"><i aria-hidden="true"></i>Purse</div>
      <div><h1>Know where your money goes.</h1><p class="lead" style="margin-top:12px">Record what comes in and what goes out. Everything stays on this phone and works without internet.</p></div>
      <div class="field"><span class="lbl">Your currency</span><div class="chips" role="radiogroup" aria-label="Currency">${curs.map(c => `<button type="button" class="chip" role="radio" aria-checked="${st.cur === c}" data-cur="${c}">${curSymbol(c) === c ? c : esc(curSymbol(c)) + ' ' + c}</button>`).join('')}<button type="button" class="chip" data-more-cur>More${ico('chevR', 16)}</button></div></div>
      <div class="field"><span class="lbl">Your month starts on ${infoBtn('If you are paid on the 25th, choose 25 so each period runs from payday to payday. You can change this later in Settings.')}</span><div class="chips" role="radiogroup" aria-label="Month start day">${(days.includes(st.day) ? days : days.concat(st.day)).map(d => `<button type="button" class="chip" role="radio" aria-checked="${st.day === d}" data-day="${d}">${ordinal(d)}</button>`).join('')}<button type="button" class="chip" data-more-day>Other${ico('chevR', 16)}</button></div></div>
      <div class="spacer"></div>
      <button type="button" class="btn primary block" data-go>Get started</button>
      <button type="button" class="btn ghost block" data-restore>I have a backup file</button>`;
  };
  draw();
  g.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b || b.hasAttribute('data-info')) return;
    if (b.dataset.cur) { st.cur = b.dataset.cur; draw(); }
    else if (b.dataset.day) { st.day = +b.dataset.day; draw(); }
    else if (b.hasAttribute('data-more-cur')) openCurrencyPage(st.cur, async c => { st.cur = c; draw(); return true; });
    else if (b.hasAttribute('data-more-day')) openMonthSheet(st.day, d => { st.day = d; draw(); });
    else if (b.hasAttribute('data-restore')) await restoreFlow();
    else if (b.hasAttribute('data-go')) {
      S.settings.currency = st.cur; S.settings.monthStart = st.day; S.settings.onboarded = true;
      persist(); g.remove(); updateInert(); render();
    }
  });
  $('#app').appendChild(g); updateInert();
  setTimeout(() => { const h = $('h1', g); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); } }, 50);
}
function showCorruptGate(raw) {
  try { localStorage.setItem(KEY_CORRUPT, raw); } catch (e) { /* ignore */ }
  S = freshState();      // in memory only, nothing is saved until the user chooses
  const g = document.createElement('div'); g.className = 'gate'; g.setAttribute('role', 'alertdialog'); g.setAttribute('aria-label', 'Saved data problem');
  g.innerHTML = `<div class="brand"><i aria-hidden="true"></i>Purse</div>
    <div><h1>We could not read your saved data.</h1><p class="lead" style="margin-top:12px">Nothing has been deleted. A copy of the damaged data is kept on this phone. You can restore from a backup file, or save the damaged data so someone can try to recover it.</p></div>
    <div class="spacer"></div>
    <button type="button" class="btn primary block" data-restore>${ico('upload', 20)}Restore from a backup file</button>
    <button type="button" class="btn soft block" data-save>${ico('download', 20)}Save the damaged data</button>
    <button type="button" class="btn ghost block" data-fresh>Start fresh</button>`;
  g.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-restore')) await restoreFlow();
    else if (b.hasAttribute('data-save')) downloadText(raw, 'purse-damaged-data.txt', 'text/plain');
    else if (b.hasAttribute('data-fresh')) {
      const ok = await dialog({ title: 'Start with an empty Purse?', body: 'The damaged data stays saved on this phone, but you will not see it in the app.', actions: [{ label: 'Start fresh', kind: 'danger', value: true }, { label: 'Go back', kind: 'soft', value: false }] });
      if (ok) { g.remove(); persist(); updateInert(); showWelcomeGate(); }
    }
  });
  $('#app').appendChild(g); updateInert();
}

/* =====================================================================
   9. SERVICE WORKER AND BOOT
   ===================================================================== */
let swReg = null, reloading = false, updateRequested = false;
function applyUpdate() { if (swReg && swReg.waiting) { updateRequested = true; swReg.waiting.postMessage('SKIP_WAITING'); } }
function registerSW() {
  if (!('serviceWorker' in navigator) || !(location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) return;
  /* Reload only when the person asked for the update. The first-visit takeover must not reload the page. */
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!updateRequested || reloading) return; reloading = true; location.reload(); });
  navigator.serviceWorker.register('sw.js').then(reg => {
    swReg = reg;
    const check = () => { if (reg.waiting && navigator.serviceWorker.controller) { window.__updateReady = true; if (S && !$('.gate')) render(); } };
    /* A new version may already be installing by the time register() resolves, so also watch that worker. */
    const watch = w => { if (!w) return; if (w.state === 'installed') check(); else w.addEventListener('statechange', () => { if (w.state === 'installed') check(); }); };
    check(); watch(reg.installing);
    reg.addEventListener('updatefound', () => watch(reg.installing));
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => { }); });
  }).catch(() => { /* app still works online */ });
}
function boot() {
  const r = loadState();
  history.replaceState({ d: 0, tab: 'home' }, '');
  lockCfg = loadLock();
  const start = () => {
    if (r.note === 'corrupt') { showCorruptGate(r.corruptRaw); return; }
    if (!S.settings.onboarded) showWelcomeGate(); else render();
    if (r.note === 'recovered') toast('Your latest save could not be read, so the previous copy was restored.', { kind: 'warn', ms: 8000 });
  };
  if (r.note !== 'corrupt') { S = r.state; applyTheme(); if (r.note === 'recovered') { try { localStorage.setItem(KEY_CORRUPT, r.corruptRaw); } catch (e) { /* ignore */ } persist(); } }
  if (lockCfg) {
    /* Decide at launch: lock if the chosen idle time has passed, or if it is set to lock every time. */
    const gap = Date.now() - (lockCfg.lastActive || 0), lim = idleLimit();
    startLockWatch();
    if (lockCfg.broken || !lim || gap >= lim || gap < 0) { locked = true; postUnlock = start; showLockScreen(); registerSW(); return; }
    lastActive = Date.now();
  }
  start(); registerSW();
}
/* Another window (for example the installed app and a browser tab) changed the data.
   Reload it so this window never overwrites those changes with stale data. */
window.addEventListener('storage', e => {
  if (e.key === KEY_LOCK) {
    const was = !!lockCfg; lockCfg = loadLock();
    if (lockCfg && !was) startLockWatch();
    if (!lockCfg && locked) unlock();
    return;
  }
  if (e.key !== KEY || !S || e.newValue === null) return;
  let v; try { v = validateData(JSON.parse(e.newValue)); } catch (x) { return; }
  if (!v.ok) return;
  S = v.data; applyTheme();
  if (locked) return;
  while (layers.length) removeLayer(layers.pop());
  history.replaceState({ d: 0, tab: ui.tab }, ''); updateInert();
  if (!$('.gate')) { render(); toast('Updated from another window'); }
});
boot();
</script>
</body>
</html>
